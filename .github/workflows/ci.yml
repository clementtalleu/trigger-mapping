name: CI

on: [push, pull_request]

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        symfony-version: ['6.4.*', '7.4.*']
        exclude:
          # Symfony 6.4 doesn't officially support PHP 8.4
          - php-version: '8.4'
            symfony-version: '6.4.*'
        include:
          # Symfony 8 requires PHP 8.4+
          - php-version: '8.4'
            symfony-version: '8.0.*'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          # pdo_sqlsrv is platform-specific; only the functional sqlserver job needs it.
          # Keeping it out of unit_tests avoids requiring msodbcsql18 here.
          extensions: pdo_mysql, pdo_pgsql

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install Symfony ${{ matrix.symfony-version }}
        run: |
          composer require --no-update symfony/framework-bundle:${{ matrix.symfony-version }}
          composer require --no-update symfony/http-kernel:${{ matrix.symfony-version }}
          composer require --no-update symfony/config:${{ matrix.symfony-version }}
          composer require --no-update symfony/dependency-injection:${{ matrix.symfony-version }}

      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress

      - name: Run phpstan
        run: vendor/bin/phpstan analyse src

      - name: Run php-cs-fixer (dry-run)
        run: PHP_CS_FIXER_IGNORE_ENV=1 vendor/bin/php-cs-fixer fix src --dry-run --diff --no-ansi

  functional_tests:
    runs-on: ubuntu-latest
    needs: unit_tests
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']
        symfony-version: ['6.4.*', '7.4.*']
        platform: [mysql, postgresql, sqlserver]
        exclude:
          # Symfony 6.4 doesn't officially support PHP 8.4
          - php-version: '8.4'
            symfony-version: '6.4.*'
        include:
          # Symfony 8 with MySQL
          - php-version: '8.4'
            symfony-version: '8.0.*'
            platform: mysql
          # Symfony 8 with PostgreSQL
          - php-version: '8.4'
            symfony-version: '8.0.*'
            platform: postgresql
          # Symfony 8 with SQL Server
          - php-version: '8.4'
            symfony-version: '8.0.*'
            platform: sqlserver

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'root_password'
          MYSQL_DATABASE: 'test_db'
          MYSQL_USER: 'test_user'
          MYSQL_PASSWORD: 'test_password'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: 'test_db'
          POSTGRES_USER: 'test_user'
          POSTGRES_PASSWORD: 'test_password'
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'StrongPassw0rd'
          MSSQL_PID: 'Developer'
        ports: ['1433:1433']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The pdo_sqlsrv PHP extension is just a wrapper — it requires the
      # Microsoft ODBC Driver 18 to be present at the OS level. We install
      # it BEFORE setup-php so the extension can link properly at startup.
      - name: Install Microsoft ODBC Driver 18 for SQL Server
        if: matrix.platform == 'sqlserver'
        run: |
          set -eux
          curl -sSL -O "https://packages.microsoft.com/config/ubuntu/$(lsb_release -rs)/packages-microsoft-prod.deb"
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y msodbcsql18 unixodbc-dev

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: xdebug
          # pdo_sqlsrv is only added on the sqlserver matrix entry — installing
          # it elsewhere would fail because msodbcsql18 isn't installed there.
          extensions: ${{ matrix.platform == 'sqlserver' && 'pdo_mysql, pdo_pgsql, pdo_sqlsrv' || 'pdo_mysql, pdo_pgsql' }}

      - name: Install Symfony ${{ matrix.symfony-version }}
        run: |
          composer require --no-update symfony/framework-bundle:${{ matrix.symfony-version }}
          composer require --no-update symfony/http-kernel:${{ matrix.symfony-version }}
          composer require --no-update symfony/config:${{ matrix.symfony-version }}
          composer require --no-update symfony/dependency-injection:${{ matrix.symfony-version }}

      - name: Install Dependencies
        run: composer update --prefer-dist --no-progress

      - name: Wait for SQL Server to be ready
        if: matrix.platform == 'sqlserver'
        timeout-minutes: 2
        run: |
          until nc -z 127.0.0.1 1433; do echo "Waiting for SQL Server port..."; sleep 2; done
          # Extra time for the SA login + master DB initialization
          sleep 15

      - name: Run Functional Tests (MySQL)
        if: matrix.platform == 'mysql'
        env:
          DATABASE_URL: 'mysql://root:root_password@127.0.0.1:3306/test_db?serverVersion=8.0'
        run: vendor/bin/phpunit --testsuite=mysql

      - name: Run Functional Tests (PostgreSQL)
        if: matrix.platform == 'postgresql'
        env:
          DATABASE_URL: 'postgresql://test_user:test_password@127.0.0.1:5432/test_db?serverVersion=15'
        run: vendor/bin/phpunit --testsuite=postgresql

      - name: Run Functional Tests (SQL Server)
        if: matrix.platform == 'sqlserver'
        env:
          DATABASE_URL: 'pdo-sqlsrv://sa:StrongPassw0rd@127.0.0.1:1433/test_db?serverVersion=2022&charset=UTF-8'
        run: vendor/bin/phpunit -c phpunit-sqlserver.xml.dist

  legacy_doctrine_tests:
    name: 'Legacy Doctrine (ORM ^2.16 + DBAL ^3)'
    runs-on: ubuntu-latest
    needs: unit_tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'root_password'
          MYSQL_DATABASE: 'test_db'
          MYSQL_USER: 'test_user'
          MYSQL_PASSWORD: 'test_password'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: 'test_db'
          POSTGRES_USER: 'test_user'
          POSTGRES_PASSWORD: 'test_password'
        ports: ['5432:5432']
        options: >-
          --health-cmd="pg_isready"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql, pdo_pgsql

      - name: Constrain to ORM ^2.16 + DBAL ^3
        run: |
          composer require --no-update "doctrine/orm:^2.16" "doctrine/dbal:^3.0"
          composer update --prefer-dist --no-progress --with-all-dependencies

      - name: Run MySQL functional tests
        env:
          DATABASE_URL: 'mysql://root:root_password@127.0.0.1:3306/test_db?serverVersion=8.0'
        run: vendor/bin/phpunit --testsuite=mysql

      - name: Run PostgreSQL functional tests
        env:
          DATABASE_URL: 'postgresql://test_user:test_password@127.0.0.1:5432/test_db?serverVersion=15'
        run: vendor/bin/phpunit -c phpunit-postgresql.xml.dist

  no_migrations_bundle_tests:
    name: 'Without doctrine-migrations-bundle (optional dep)'
    runs-on: ubuntu-latest
    needs: unit_tests
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 'root_password'
          MYSQL_DATABASE: 'test_db'
          MYSQL_USER: 'test_user'
          MYSQL_PASSWORD: 'test_password'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot_password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress

      - name: Remove doctrine-migrations-bundle to verify the bundle still works without it
        run: composer remove --dev --update-with-all-dependencies doctrine/doctrine-migrations-bundle

      - name: Run unit tests (without migrations-bundle)
        run: vendor/bin/phpunit --testsuite=unit

      - name: Run MySQL functional tests (without migrations-bundle)
        env:
          DATABASE_URL: 'mysql://root:root_password@127.0.0.1:3306/test_db?serverVersion=8.0'
        run: vendor/bin/phpunit --testsuite=mysql
